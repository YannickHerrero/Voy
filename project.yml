name: Voy
options:
  bundleIdPrefix: com.yannickherrero
  deploymentTarget:
    iOS: "18.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Voy:
    type: application
    platform: iOS
    sources:
      - path: Voy
    attributes:
      SystemCapabilities:
        com.apple.iCloud:
          enabled: 1
        com.apple.Push:
          enabled: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yannickherrero.voy
        CODE_SIGN_ENTITLEMENTS: Voy/Voy.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Voy
        INFOPLIST_KEY_NSCameraUsageDescription: Add photographs of your possessions to your private inventory.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose photographs of possessions for your private inventory.
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SUPPORTS_MACCATALYST: false
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "$(VOY_APP_PROFILE)"
    scheme:
      testTargets:
        - VoyTests
  VoyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoyTests
    dependencies:
      - target: Voy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yannickherrero.voy.tests
        GENERATE_INFOPLIST_FILE: true
